# Deploys the web pit wall (web/dist) to GitHub Pages, which serves
# aio.apexandchill.co.uk (web/src/CNAME). The build is scripts/build-web.js —
# plain Node, no install — so a push to main that touches the Team tab's
# files ships the same change to the browser version.
name: Web pit wall

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'electron/control-panel/**'
      - 'scripts/build-web.js'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web/dist
        run: node scripts/build-web.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
