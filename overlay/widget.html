<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex &amp; Chill — Single Overlay</title>

  <!--
    Standalone single-widget overlay page.
    Renders exactly ONE widget (chosen with ?w=<name>) on a transparent
    background so it can be added to OBS as its own Browser Source and
    positioned independently. The all-in-one page is still at "/".

    Examples:
      /widget.html?w=standings
      /widget.html?w=fuel
      /widget.html?w=pedals&port=17080    (override WS port if needed)

    Valid names: standings, relative, delta, pacedelta, weather, fuel, fuelplan,
                 tyres, pedals, pedalsv, motion, damage, radar, trackmap, limits,
                 racecontrol, mfd

    It reuses the exact same widget runtime (client.js) and widget modules as
    the combined page. client.js binds a widget only if its section is present,
    so including a single section renders just that one widget.
  -->
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/overlay.css" />
  <link rel="stylesheet" href="css/single.css" />

  <!-- Audio cues (synthesised, no assets). Before appearance.js, which hands it
       the operator's on/off + volume. Add ?audio=off to silence just this
       source when several overlay sources share one OBS scene. -->
  <script src="js/audio.js"></script>
  <!-- Global widget-background opacity (control panel / ?bg=). Synchronous and
       in <head> so the operator's setting is applied before the first paint. -->
  <script src="js/appearance.js"></script>
  <!-- Canvas backing-store scale (see js/raster.js). Synchronous so it is there
       for the deferred widget scripts, which size their bitmaps at first paint. -->
  <script src="js/raster.js"></script>
</head>
<body>
  <!-- The single widget section is injected here synchronously (below). -->
  <div class="single-page" id="single-page"></div>

  <!-- Shared per-widget shell markup (synchronous — used by the inline
       injector below before the deferred runtime scripts run). -->
  <script src="js/shells.js"></script>
  <script>
    // -----------------------------------------------------------------------
    // Inject the requested widget's section shell BEFORE the deferred runtime
    // scripts run, so client.js finds and binds it on boot. This inline script
    // executes during parsing (not deferred), guaranteeing correct ordering.
    // -----------------------------------------------------------------------
    (function () {
      "use strict";

      var SHELLS = window.ApexShells;
      var params = new URLSearchParams(window.location.search);
      var name = (params.get("w") || "").trim().toLowerCase();
      var mount = document.getElementById("single-page");
      var shell = SHELLS[name];

      if (shell) {
        mount.innerHTML = shell;
        document.title = "Apex & Chill — " + name;
      } else {
        // Unknown/missing widget name — show the valid options instead of blank.
        mount.innerHTML =
          '<pre class="single-error">Unknown overlay "' +
          (name ? name.replace(/[<>&]/g, "") : "(none)") +
          '".\nUse ?w=&lt;name&gt; where name is one of:\n  ' +
          Object.keys(SHELLS).join(", ") +
          "</pre>";
      }
    })();
  </script>

  <!-- Same runtime + widget modules as the combined page. client.js only binds
       the one section present above; the rest are inert. -->
  <script src="js/client.js" defer></script>
  <script src="js/widgets/standings.js" defer></script>
  <script src="js/widgets/delta.js" defer></script>
  <script src="js/widgets/pacedelta.js" defer></script>
  <script src="js/widgets/refpace.js" defer></script>
  <script src="js/widgets/relative.js" defer></script>
  <script src="js/widgets/weather.js" defer></script>
  <script src="js/widgets/fuel.js" defer></script>
  <script src="js/widgets/tyres.js" defer></script>
  <!-- Designs register into ApexSpeedoDesigns before speedo.js dispatches. -->
  <script src="js/widgets/speedo-lmp2.js" defer></script>
  <script src="js/widgets/speedo-gt3.js" defer></script>
  <script src="js/widgets/speedo-real.js" defer></script>
  <script src="js/widgets/speedo.js" defer></script>
  <script src="js/widgets/pedals.js" defer></script>
  <script src="js/widgets/pedalsv.js" defer></script>
  <script src="js/widgets/motion.js" defer></script>
  <script src="js/widgets/damage.js" defer></script>
  <script src="js/widgets/radar.js" defer></script>
  <script src="js/widgets/trackmap.js" defer></script>
  <script src="js/widgets/limits.js" defer></script>
  <script src="js/widgets/racecontrol.js" defer></script>
  <script src="js/widgets/mfd.js" defer></script>
  <script src="js/widgets/chat.js" defer></script>
  <!-- Fuel Planner: reference-data module must load before its widget. -->
  <script src="js/data/racedata.js" defer></script>
  <script src="js/widgets/fuelplan.js" defer></script>
</body>
</html>
