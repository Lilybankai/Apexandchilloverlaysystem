<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Apex &amp; Chill — In-game Overlays</title>

  <!--
    In-game overlay layer.
    Loaded ONLY by the desktop app into a transparent, click-through,
    always-on-top window covering the screen, so overlays render directly over
    the sim (no OBS involved). Widgets to show are passed by the app as
    ?widgets=standings,relative,… — every widget lives in a movable/scalable
    .ig-item wrapper managed by js/ingame.js (drag + resize in edit mode,
    placement persisted through the window.apexIngame bridge).

    Opened in a normal browser it still works (demo of the layer), it just
    cannot persist layout (no bridge) — positions then live in localStorage.
  -->
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/overlay.css" />
  <link rel="stylesheet" href="css/ingame.css" />

  <!-- Audio cues (synthesised, no assets). Before appearance.js, which hands it
       the operator's on/off + volume as soon as they arrive over the bridge.
       This is the layer where the cues matter most — the driver is looking at
       the track, not at a widget. -->
  <script src="js/audio.js"></script>
  <!-- Global widget-background opacity. Here it is push-driven by the app over
       the apexIngame bridge (no polling in the layer that draws over the sim). -->
  <script src="js/appearance.js"></script>
</head>
<body class="ingame">
  <!-- Screen outlines, drawn by js/ingame.js in edit mode only, and only when
       there is more than one monitor. The layer spans the whole desktop on a
       triple-screen rig, so without these the operator is dragging widgets
       across an unbroken sheet of transparency with no way to tell where one
       screen ends and the next begins. Before the stage on purpose: both it and
       the widgets sit at the auto z-level, so DOM order is what keeps the
       outlines behind them. -->
  <div class="ig-screens" id="ig-screens" aria-hidden="true"></div>

  <!-- Widget wrappers injected here synchronously by the inline script. -->
  <div id="ig-stage"></div>

  <!-- Edit-mode chrome (hidden while locked). -->
  <div class="ig-toolbar" id="ig-toolbar" hidden>
    <span class="ig-toolbar__brand"></span>
    <span class="ig-toolbar__text">
      Editing overlays — drag to move · side edge = width · top/bottom edge =
      height · corner = scale (double-click a handle to reset it)
    </span>
    <button class="ig-btn ig-btn--ghost" id="ig-reset" type="button">Reset</button>
    <button class="ig-btn" id="ig-done" type="button">Done</button>
  </div>

  <!-- Interact-mode banner: shown when the layer is made clickable (F7). -->
  <div class="ig-interact-hint" id="ig-interact-hint" hidden>
    <span class="ig-toolbar__brand"></span>
    <span class="ig-toolbar__text">Overlay interactive — click widgets to use them</span>
    <button class="ig-btn" id="ig-interact-done" type="button">Done (F7)</button>
  </div>

  <!-- Shared widget shells + injector (synchronous so the deferred runtime
       finds the sections at boot, same pattern as widget.html). -->
  <script src="js/shells.js"></script>
  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(window.location.search);
      var wanted = (params.get("widgets") || "")
        .split(",")
        .map(function (s) { return s.trim().toLowerCase(); })
        .filter(function (s) { return !!window.ApexShells[s]; });
      if (wanted.length === 0) wanted = Object.keys(window.ApexShells);

      // The speedo cluster NESTS the radar and the track map in its pods. Both
      // modules keep module-level state and client.js binds one root per widget,
      // so a loose copy sitting earlier in the DOM wins the selector and leaves
      // the cluster's pods as permanent "Awaiting telemetry…" placeholders —
      // which looks like a dead feed rather than a duplicated widget. When the
      // cluster is on screen it owns them; drop the loose copies.
      if (wanted.indexOf("speedo") !== -1) {
        wanted = wanted.filter(function (s) {
          return s !== "radar" && s !== "trackmap";
        });
      }

      var stage = document.getElementById("ig-stage");
      // Six resize handles per widget (see js/ingame.js): a side edge sets
      // width, a top/bottom edge sets height, a corner scales the whole widget.
      // Every gesture exists on both sides so a widget that has ended up with
      // its bottom or right edge past the screen can still be resized from the
      // side that is still on it.
      var handles =
        '<div class="ig-item__handle ig-item__handle--e" data-resize="width"' +
        ' title="Drag to set width — double-click to reset"></div>' +
        '<div class="ig-item__handle ig-item__handle--w" data-resize="width-w"' +
        ' title="Drag to set width — double-click to reset"></div>' +
        '<div class="ig-item__handle ig-item__handle--s" data-resize="height"' +
        ' title="Drag to set height — double-click to reset"></div>' +
        '<div class="ig-item__handle ig-item__handle--n" data-resize="height-n"' +
        ' title="Drag to set height — double-click to reset"></div>' +
        '<div class="ig-item__handle ig-item__handle--se" data-resize="scale"' +
        ' title="Drag to scale — double-click to reset"></div>' +
        '<div class="ig-item__handle ig-item__handle--nw" data-resize="scale-nw"' +
        ' title="Drag to scale — double-click to reset"></div>';
      var html = "";
      for (var i = 0; i < wanted.length; i++) {
        html +=
          '<div class="ig-item" data-id="' + wanted[i] + '">' +
          window.ApexShells[wanted[i]] +
          handles +
          "</div>";
      }
      stage.innerHTML = html;
    })();
  </script>

  <!-- Same runtime + widget modules as every other overlay page. -->
  <script src="js/client.js" defer></script>
  <script src="js/widgets/standings.js" defer></script>
  <script src="js/widgets/delta.js" defer></script>
  <script src="js/widgets/pacedelta.js" defer></script>
  <script src="js/widgets/refpace.js" defer></script>
  <script src="js/widgets/relative.js" defer></script>
  <script src="js/widgets/weather.js" defer></script>
  <script src="js/widgets/fuel.js" defer></script>
  <script src="js/widgets/tyres.js" defer></script>
  <script src="js/widgets/speedo.js" defer></script>
  <script src="js/widgets/pedals.js" defer></script>
  <script src="js/widgets/pedalsv.js" defer></script>
  <script src="js/widgets/motion.js" defer></script>
  <script src="js/widgets/damage.js" defer></script>
  <script src="js/widgets/radar.js" defer></script>
  <script src="js/widgets/trackmap.js" defer></script>
  <script src="js/widgets/limits.js" defer></script>
  <script src="js/widgets/racecontrol.js" defer></script>
  <script src="js/widgets/mfd.js" defer></script>
  <script src="js/widgets/chat.js" defer></script>
  <!-- Fuel Planner: reference-data module must load before its widget. -->
  <script src="js/data/racedata.js" defer></script>
  <script src="js/widgets/fuelplan.js" defer></script>
  <!-- Layout + edit-mode manager (after the runtime; operates on wrappers). -->
  <script src="js/ingame.js" defer></script>
</body>
</html>
