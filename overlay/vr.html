<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Apex AIO — VR panel</title>

  <!--
    The headset panel.
    Loaded ONLY by the desktop app, into an OFFSCREEN window that is never
    shown on the monitor: its painted frames are handed to SteamVR, which draws
    them as a world-locked panel in the headset (see electron/vr/). Same widget
    shells and runtime as every other overlay page — nothing about a widget
    knows it is in VR.

    Widgets are passed as ?widgets=speedo,relative and laid out in one row,
    bottom-aligned, at their natural size. The window is sized to the panel, so
    the page is the texture: there is no stage and no edit mode here —
    placement happens in the headset's space, from the control panel.

    No audio.js on purpose: the desktop layer and the driver's speakers already
    sound every cue, and two pages sounding one cue is an echo.
  -->
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/overlay.css" />
  <link rel="stylesheet" href="css/single.css" />
  <link rel="stylesheet" href="css/vr.css" />

  <script src="js/appearance.js"></script>
  <script src="js/raster.js"></script>
</head>
<body class="vr">
  <div class="vr-panel" id="vr-panel"></div>

  <script src="js/shells.js"></script>
  <script>
    (function () {
      "use strict";
      var params = new URLSearchParams(window.location.search);
      var wanted = (params.get("widgets") || "speedo,relative")
        .split(",")
        .map(function (s) { return s.trim().toLowerCase(); })
        .filter(function (s) { return !!window.ApexShells[s]; });
      var html = "";
      for (var i = 0; i < wanted.length; i++) {
        html += '<div class="vr-slot" data-id="' + wanted[i] + '">' + window.ApexShells[wanted[i]] + "</div>";
      }
      document.getElementById("vr-panel").innerHTML = html;
    })();
  </script>

  <script src="js/client.js" defer></script>
  <script src="js/widgets/relative.js" defer></script>
  <script src="js/widgets/delta.js" defer></script>
  <script src="js/widgets/pacedelta.js" defer></script>
  <script src="js/widgets/fuel.js" defer></script>
  <script src="js/widgets/tyres.js" defer></script>
  <script src="js/widgets/standings.js" defer></script>
  <script src="js/widgets/radar.js" defer></script>
  <!-- Designs register into ApexSpeedoDesigns before speedo.js dispatches. -->
  <script src="js/widgets/speedo-lmp2.js" defer></script>
  <script src="js/widgets/speedo-gt3.js" defer></script>
  <script src="js/widgets/speedo-real.js" defer></script>
  <script src="js/widgets/speedo.js" defer></script>
</body>
</html>
